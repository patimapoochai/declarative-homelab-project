apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: {{ .Release.Name }}
        image: {{ .Values.image.repository }}/grafana-oss:{{ .Values.image.tag }}
        ports:
        - containerPort: 30007
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: grafana-data
        - mountPath: /usr/share/grafana/conf
          name: grafana-config
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
      - name: grafana-config
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-config
