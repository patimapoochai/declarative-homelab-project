---
- name: Setup localhost
  hosts: localhost
  vars:
    helm_file: "helm-v3.17.3-linux-amd64.tar.gz"
  tasks:
  - file: 
      path: helm-files
      state: directory
  - name: unpack helm
    ansible.builtin.unarchive:
      src: "helm-files/{{ helm_file }}"
      dest: helm-files
- name: Install helm on Rocky Linux 9 hosts
  hosts: rocky,&k3s
  become: true
  tasks:
  - name: put helm in /usr/bin/
    copy:
      src: helm-files/linux-amd64/helm
      dest: /usr/bin/
      mode: '755'
