apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: default
spec:
  selector:
    app: heimdall
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: LoadBalancer
      # Optional field
      # By default and for convenience, the Kubernetes control plane
      # will allocate a port from a range (default: 30000-32767)
